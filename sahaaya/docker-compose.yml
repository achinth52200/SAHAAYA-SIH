version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sahaaya-postgres
    environment:
      POSTGRES_DB: sahaaya
      POSTGRES_USER: sahaaya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahaaya_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahaaya -d sahaaya"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sahaaya-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sahaaya-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sahaaya-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sahaaya-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://sahaaya:${POSTGRES_PASSWORD:-sahaaya_secure_password}@postgres:5432/sahaaya
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sahaaya-network
    restart: unless-stopped

  # Next.js Web Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sahaaya-web
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:8000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sahaaya-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sahaaya-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api-gateway
    networks:
      - sahaaya-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  sahaaya-network:
    driver: bridge